name: Frontend

#
# 경로 필터를 걸지 않는다. required status check 로 걸려면 모든 PR 에서 리포트되어야 하는데,
# 경로 필터가 있으면 해당 경로를 건드리지 않은 PR 에서 체크가 아예 보고되지 않아
# "Expected — Waiting for status" 로 머지가 영구히 막힌다.
# 이 저장소 규모에서는 전부 돌려도 2~3분이라 게이트가 되는 값이 더 크다.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 활성화
        run: corepack enable pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # next build 가 타입 체크까지 수행한다.
      - run: pnpm build
