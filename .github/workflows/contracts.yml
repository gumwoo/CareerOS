name: Contracts

# 계약(schemas/)과 정본 문서가 조용히 갈라지는 것을 막는다.
#
# 경로 필터를 걸지 않는다. 실행 비트 검사처럼 저장소 전체를 보는 규칙이 있어서
# "backend/ 아래에 .sh 를 추가"만 해도 돌아야 하고, 8초짜리라 항상 돌려도 싸다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 계약 검사
        run: python tools/check_contracts.py

      - name: 메타테스트 — 검사가 실제로 위반을 잡는가
        # 계약이 통과하는 것만으로는 부족하다. 검사가 아무것도 안 해도 통과하기 때문이다.
        run: python tools/meta_test_contracts.py

      - name: 메타테스트가 원본을 되돌렸는지 확인
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "메타테스트가 파일을 되돌리지 못했다:"
            git status --porcelain
            exit 1
          fi
