name: Contracts

# 계약(schemas/)과 정본 문서가 조용히 갈라지는 것을 막는다.
# 코드를 건드리지 않아도 계약만 바뀌면 돌아야 하므로 별도 job으로 둔다.
on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/contracts.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 계약 검사
        run: python tools/check_contracts.py

      - name: 메타테스트 — 검사가 실제로 위반을 잡는가
        # 계약이 통과하는 것만으로는 부족하다. 검사가 아무것도 안 해도 통과하기 때문이다.
        run: python tools/meta_test_contracts.py

      - name: 메타테스트가 원본을 되돌렸는지 확인
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "메타테스트가 파일을 되돌리지 못했다:"
            git status --porcelain
            exit 1
          fi
