name: Backend

# 계약은 backend 가 런타임에 강제하는 대상이라 schemas/ 변경도 backend 를 깨뜨릴 수 있다.
#
# 경로 필터를 걸지 않는다. required status check 로 걸려면 모든 PR 에서 리포트되어야 하는데,
# 경로 필터가 있으면 해당 경로를 건드리지 않은 PR 에서 체크가 아예 보고되지 않아
# "Expected — Waiting for status" 로 머지가 영구히 막힌다.
# 이 저장소 규모에서는 전부 돌려도 2~3분이라 게이트가 되는 값이 더 크다.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  unit:
    name: 단위 테스트 (Docker 불필요)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test --no-daemon

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  integration:
    name: 통합 테스트 (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Flyway 마이그레이션과 pgvector 확장까지 실제로 적용해 본다.
      - run: ./gradlew integrationTest --no-daemon

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: backend/build/reports/tests/integrationTest
          if-no-files-found: ignore
